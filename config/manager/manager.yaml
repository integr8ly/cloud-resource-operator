apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-resource-operator
  namespace: system
spec:
  replicas: 1
  selector:
    matchLabels:
      name: cloud-resource-operator
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        name: cloud-resource-operator
    spec:
      serviceAccountName: cloud-resource-operator
      containers:
      - name: cloud-resource-operator
        command:
        - cloud-resource-operator
        args:
        - --enable-leader-election
        - --metrics-bind-address=:8383
        - --metrics-secure=false
        image: controller
        imagePullPolicy: Always
        livenessProbe:
          exec:
            command:
              - ls
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          exec:
            command:
              - ls
          initialDelaySeconds: 5
          periodSeconds: 10
        env:
        - name: WATCH_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: OPERATOR_NAME
          value: "cloud-resource-operator"
        - name: TAG_KEY_PREFIX
          value: integreatly.org/
        volumeMounts:
        - name: bound-sa-token
          mountPath: /var/run/secrets/openshift/serviceaccount
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"
      volumes:
      - name: bound-sa-token
        projected:
          sources:
          - serviceAccountToken:
              path: token
              audience: openshift